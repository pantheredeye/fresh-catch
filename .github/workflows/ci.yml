name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not `pnpm check`/`pnpm generate`: that runs `wrangler types`, which
      # needs Cloudflare auth to regenerate worker-configuration.d.ts. CI
      # type-checks against the committed worker-configuration.d.ts instead.
      - run: pnpm types

      - run: pnpm test

# Deploy is intentionally NOT wired up here — fresh-catch ships manually via
# `pnpm run deploy` (package.json → `wrangler deploy`). #53 re-adds a D1
# migration step ahead of it once the schema lands; until then there's
# nothing to migrate.
#
# To add auto-deploy on main later: add a `deploy` job with `needs: check`,
# `if: github.ref == 'refs/heads/main' && github.event_name == 'push'`,
# run `pnpm run deploy`, and add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# as GitHub repo secrets.
